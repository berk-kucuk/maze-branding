# Maze Linux login/greeter theme.
#
# KDE's Breeze greeter, branded with the Maze wallpaper via
# /usr/share/sddm/themes/breeze/theme.conf.user (SDDM merges theme.conf.user over
# the package's theme.conf, so Plasma updates never clobber it).
#
# Why Breeze rather than a Maze-owned copy of it: Breeze's Main.qml imports
# org.kde.breeze.components and org.kde.plasma.private.keyboardindicator. Those
# are PRIVATE Plasma APIs with no stability guarantee — KDE changes them between
# releases. A forked copy would freeze against today's API and eventually fail to
# render after a Plasma update, and this is the one component where a failure
# locks the user out. Riding the real Breeze theme means it is always in step with
# the installed Plasma, and the branding still comes from us.
#
# The in-house 'maze-oled' theme is still shipped (usr/share/sddm/themes/maze-oled)
# but is NOT the default; it is a plain QtQuick theme with no private imports, so
# it is available as a fallback and as a base for future design work.
#
# Any theme can be checked WITHOUT logging out or rebooting:
#     sddm-greeter-qt6 --test-mode --theme /usr/share/sddm/themes/breeze
[Theme]
Current=breeze
