# Managed by Maze Linux (maze-branding).
#
# The shutdown splash renders text through label-pango.so, and fontconfig
# mmaps its caches from /var/cache/fontconfig (shared read-only mappings).
# plymouthd lives until the very end of shutdown, so those mappings pin the
# separate @cache subvolume and every poweroff/reboot logged
#   umount: /var/cache: target is busy  /  Failed unmounting /var/cache
# — fuser cannot show it because plymouthd has chrooted into /run/initramfs.
# With mmap off, fontconfig read()s the caches into memory and closes them,
# and nothing holds the mount any more.
[Service]
Environment=FONTCONFIG_USE_MMAP=no
